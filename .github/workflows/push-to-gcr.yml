name: Build and deploy to Cloud Run
on:
  workflow_dispatch:
  push:
    branches:
      - main
# GCP_* repo variables come from `terraform output github_variables`.
# NEXT_PUBLIC_* repo variables are optional: empty leaves that integration mocked.
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    env:
      IMAGE: ${{ vars.GCP_IMAGE_REPO }}/name-remember
      SERVICE_URL: ${{ vars.GCP_SERVICE_URL }}
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build and push image
        env:
          REGION: ${{ vars.GCP_REGION }}
          STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          SLACK_ID: ${{ vars.NEXT_PUBLIC_SLACK_ID }}
          GTM_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_TAG_MANAGER_ID }}
          AMPLITUDE_API_KEY: ${{ vars.NEXT_PUBLIC_AMPLITUDE_API_KEY }}
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build ./next-client \
            --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="$STRIPE_PUBLISHABLE_KEY" \
            --build-arg NEXT_PUBLIC_STRIPE_RETURN_URL="$SERVICE_URL/profile" \
            --build-arg NEXT_PUBLIC_SLACK_ID="$SLACK_ID" \
            --build-arg NEXT_PUBLIC_SLACK_APP_REDIRECT_URI="$SERVICE_URL/slack-app" \
            --build-arg NEXT_PUBLIC_SLACK_DASHBOARD_REDIRECT_URI="$SERVICE_URL/dashboard" \
            --build-arg NEXT_PUBLIC_GOOGLE_TAG_MANAGER_ID="$GTM_ID" \
            --build-arg NEXT_PUBLIC_AMPLITUDE_API_KEY="$AMPLITUDE_API_KEY" \
            --build-arg SITE_URL="$SERVICE_URL" \
            --tag "$IMAGE:$GITHUB_SHA" \
            --tag "$IMAGE:latest"
          docker push --all-tags "$IMAGE"
      - id: "deploy"
        uses: "google-github-actions/deploy-cloudrun@v3"
        with:
          service: ${{ vars.GCP_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
      - name: Smoke test
        run: curl --fail --silent --show-error --output /dev/null "$SERVICE_URL"
